[metadata]
name = slo-router
version = 0.1.0
description = Workload-aware LLM inference router with Jev features and replay benchmarks

[options]
packages = find:
python_requires = >=3.9
install_requires =
    fastapi>=0.110
    uvicorn>=0.29
    httpx>=0.27
    pydantic>=2

[options.extras_require]
test =
    pytest>=8

[options.entry_points]
console_scripts =
    slo-router-replay = slo_router.replay:main
    slo-router-matrix = slo_router.matrix:main
    slo-router-report = slo_router.report:main
